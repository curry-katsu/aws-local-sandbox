[project]
name = "dynamodb-data-access"
version = "0.1.0"
description = "Verification tool for DynamoDB access through the Floci-backed local sandbox."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "aws-local-sandbox contributors" }]
dynamic = ["dependencies"]

[project.scripts]
dynamodb-data-access-verify = "dynamodb_data_access.main:main"
dynamodb-index-ttl-verify = "dynamodb_data_access.index_ttl_main:main"

[tool.poetry]
packages = [{ include = "dynamodb_data_access", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
boto3 = ">=1.35.0,<2.0.0"
aws-boto-utils = { path = "../../libs/aws-boto-utils", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.0"
isort = "^5.13.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
