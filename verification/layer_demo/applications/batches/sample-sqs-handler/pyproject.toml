[project]
name = "sample-sqs-handler"
version = "0.1.0"
description = "Sample SQS Lambda application for the Floci Lambda layer demo."
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [{ name = "aws-local-sandbox contributors" }]
dynamic = ["dependencies"]

[project.scripts]
sample-sqs-handler-local = "sample_sqs_handler.handler:main"

[tool.poetry]
packages = [{ include = "sample_sqs_handler", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"

[tool.poetry.group.layer-provided]
optional = true

[tool.poetry.group.layer-provided.dependencies]
batch-utils = { path = "../../../libs/batch-utils", develop = true }
layer-demo-utils = { path = "../../../libs/utils", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.0"
isort = "^5.13.0"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
