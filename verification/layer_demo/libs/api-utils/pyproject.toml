[project]
name = "api-utils"
version = "0.1.0"
description = "API shared utilities for the Floci Lambda layer demo."
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [{ name = "aws-local-sandbox contributors" }]
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "api_utils", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"

[tool.poetry.group.layer-provided]
optional = true

[tool.poetry.group.layer-provided.dependencies]
layer-demo-utils = { path = "../utils", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.0"
isort = "^5.13.0"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
