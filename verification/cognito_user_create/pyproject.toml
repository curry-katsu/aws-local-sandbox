[project]
name = "cognito-user-create"
version = "0.1.0"
description = "Verification tool for creating a Cognito user in Floci."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "aws-local-sandbox contributors" }]
dependencies = [
  "boto3>=1.35.0,<2.0.0",
]

[project.scripts]
cognito-user-create-verify = "cognito_user_create.main:main"

[tool.poetry]
packages = [{ include = "cognito_user_create", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.0"
isort = "^5.13.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
