[project]
name = "aws-boto-utils"
version = "0.1.0"
description = "Small boto3 helper library for reusable AWS client and service access patterns."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "aws-local-sandbox contributors" }]
dependencies = [
  "boto3>=1.35.0,<2.0.0",
]

[tool.poetry]
packages = [{ include = "aws_boto_utils", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.0"
isort = "^5.13.0"
pytest = "^8.3.0"
pytest-cov = "^7.1.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-q --cov=aws_boto_utils --cov-report=term-missing --cov-report=html:coverage"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aws_boto_utils"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
