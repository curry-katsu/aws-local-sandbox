name: Deploy GUI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-gui-pages.yml
      - gui/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      - name: Run unit tests
        working-directory: gui
        run: npm test

      - name: Build GitHub Pages site
        working-directory: gui
        env:
          VITE_BASE_PATH: /aws-local-sandbox/
          VITE_ROUTER_MODE: hash
          VITE_AWS_BROWSER_ENDPOINT_URL: http://localhost:4566
          VITE_DEBUG_API_BROWSER_URL: http://localhost:5180/debug
          VITE_AWS_REGION: us-east-1
          VITE_AWS_ACCESS_KEY_ID: test
          VITE_AWS_SECRET_ACCESS_KEY: test
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
